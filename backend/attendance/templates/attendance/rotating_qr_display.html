<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Attendance QR | UPSA Attend</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #172554;
        }

        .course {
            font-size: 25px;
            font-weight: bold;
            margin: 15px 0;
        }

        .code {
            color: #2563eb;
            font-size: 20px;
        }

        .qr-image {
            width: 320px;
            height: 320px;
            max-width: 100%;
            object-fit: contain;
            margin: 20px auto;
        }

        .timer {
            font-size: 22px;
            font-weight: bold;
            color: #dc2626;
        }

        .instruction {
            font-size: 17px;
            color: #444;
        }

        .status {
            margin-top: 20px;
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>UPSA ATTEND</h1>

    <div class="course">
        {{ session.course_name }}
    </div>

    <div class="code">
        Course Code: {{ session.course_code }}
    </div>

    <p>Lecture Date: {{ session.lecture_date }}</p>

    <img
        id="qrImage"
        class="qr-image"
        src="{% url 'rotating_qr_image' session.id %}"
        alt="Live Attendance QR Code"
    >

    <div class="timer">
        QR refreshes in <span id="countdown">60</span> seconds
    </div>

    <p class="instruction">
        Open UPSA Attend and scan this QR code using your phone camera.
    </p>

    <p class="status">
        ● LIVE ATTENDANCE SESSION
    </p>

</div>

<script>

    const qrImage = document.getElementById("qrImage");
    const countdown = document.getElementById("countdown");

    let previousSlot = Math.floor(Date.now() / 1000 / 60);

    function refreshQR() {

        const currentTime = Math.floor(Date.now() / 1000);

        const currentSlot = Math.floor(currentTime / 60);

        const secondsRemaining = 60 - (currentTime % 60);

        countdown.textContent = secondsRemaining;

        if (currentSlot !== previousSlot) {

            previousSlot = currentSlot;

            qrImage.src =
                "{% url 'rotating_qr_image' session.id %}?t=" +
                Date.now();
        }
    }

    refreshQR();

    setInterval(refreshQR, 1000);

</script>

</body>
</html>
