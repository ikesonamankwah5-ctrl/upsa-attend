<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | UPSA Attend</title>
</head>
<body>

    <h2>Verify Your UPSA Email</h2>

    <p>A verification code has been sent to:</p>

    <strong>{{ email }}</strong>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Six-Digit Verification Code</label><br>
        <input
            type="text"
            name="otp"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="Enter OTP"
            required
        >

        <br><br>

        <label>Choose Username</label><br>
        <input
            type="text"
            name="username"
            placeholder="Choose a username"
            required
        >

        <br><br>

        <label>Create Password</label><br>
        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >

        <br><br>

        <label>Confirm Password</label><br>
        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        >

        <br><br>

        <button type="submit">Verify and Create Account</button>

    </form>

</body>
</html>
